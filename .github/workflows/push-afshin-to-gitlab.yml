name: Mirror afshin branch to GitLab (HTTP)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  push-to-gitlab:
    runs-on: ubuntu-latest
    env:
      GITLAB_HOST: 185.8.173.250
      GITLAB_REPO_PATH: root/domestic_hotel_gds.git
      GITLAB_TARGET_BRANCH: afshin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

      - name: Create commit message with changes
        id: prepare_commit_message
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          CHANGES=$(git status --porcelain=1 --untracked-files=all)
          if [ -z "$CHANGES" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MESSAGE="📦 Auto commit on branch '$BRANCH':\n"
          while IFS= read -r line; do
            [ -z "$line" ] && continue

            staged="${line:0:1}"
            unstaged="${line:1:1}"
            code="$staged"
            if [ "$code" = " " ]; then
              code="$unstaged"
            fi

            path="${line:3}"
            path="${path# }"

            case "$code" in
              M)
                MESSAGE+="- Modified: $path\n"
                ;;
              A|\?)
                MESSAGE+="- Created: $path\n"
                ;;
              D)
                MESSAGE+="- Deleted: $path\n"
                ;;
              R)
                from="${path%% -> *}"
                to="${path##* -> }"
                MESSAGE+="- Renamed: $from -> $to\n"
                ;;
              *)
                MESSAGE+="- $code: $path\n"
                ;;
            esac
          done <<< "$CHANGES"

          echo -e "$MESSAGE" > commit_message.txt
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit changes if any
        if: steps.prepare_commit_message.outputs.has_changes == 'true'
        run: |
          git add --all
          git commit -F commit_message.txt

      - name: Push to GitLab (HTTP, URL-encoded creds)
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
        run: |
          set -euo pipefail
          ENC_USER=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$GITLAB_USERNAME")
          ENC_PASS=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$GITLAB_PASSWORD")
          REMOTE_URL="http://${ENC_USER}:${ENC_PASS}@${GITLAB_HOST}/${GITLAB_REPO_PATH}"
          export GIT_TERMINAL_PROMPT=0
          git remote add gitlab "$REMOTE_URL" 2>/dev/null || git remote set-url gitlab "$REMOTE_URL"
          # بدون force برای ایمنی؛ اگر لازم شد بعدا می‌تونی --force-with-lease اضافه کنی
          git push --set-upstream gitlab HEAD:${GITLAB_TARGET_BRANCH} --force
