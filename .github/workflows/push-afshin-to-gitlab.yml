name: Mirror afshin branch to GitLab (HTTP)

on:
  push:
    branches:
      - afshin

permissions:
  contents: read

jobs:
  push-to-gitlab:
    runs-on: ubuntu-latest
    env:
      GITLAB_HOST: 185.8.173.250
      GITLAB_REPO_PATH: root/domestic_hotel_gds.git
      GITLAB_TARGET_BRANCH: afshin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

      - name: Create commit message with changes
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          MESSAGE="📦 Auto commit on branch '$BRANCH':\n"
          CHANGES=$(git status --short)
          while read -r line; do
            status=$(echo "$line" | awk '{print $1}')
            file=$(echo "$line" | awk '{print $2}')
            MESSAGE+="- $status $file\n"
          done <<< "$CHANGES"
          echo -e "$MESSAGE" > commit_message.txt

      - name: Commit changes if any
        run: |
          git add .
          if [ -s commit_message.txt ]; then
            git commit -F commit_message.txt || echo "No changes to commit"
          fi

      - name: Push to GitLab (HTTP, URL-encoded creds)
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
        run: |
          set -euo pipefail
          ENC_USER=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$GITLAB_USERNAME")
          ENC_PASS=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$GITLAB_PASSWORD")
          REMOTE_URL="http://${ENC_USER}:${ENC_PASS}@${GITLAB_HOST}/${GITLAB_REPO_PATH}"
          export GIT_TERMINAL_PROMPT=0
          git remote add gitlab "$REMOTE_URL" 2>/dev/null || git remote set-url gitlab "$REMOTE_URL"
          # بدون force برای ایمنی؛ اگر لازم شد بعدا می‌تونی --force-with-lease اضافه کنی
          git push --set-upstream gitlab HEAD:${GITLAB_TARGET_BRANCH}
