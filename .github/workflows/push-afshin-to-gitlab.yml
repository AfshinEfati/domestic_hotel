name: Mirror afshin branch to GitLab (SSH)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  push-to-gitlab:
    runs-on: ubuntu-latest

    env:
      GITLAB_HOST: 194.5.195.194
      GITLAB_PORT: 3131
      GITLAB_REPO_PATH: root/domestic_hotel_gds.git
      GITLAB_TARGET_BRANCH: afshin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

      - name: Create commit message with changes
        id: prepare_commit_message
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          CHANGES=$(git status --porcelain=1 --untracked-files=all)

          if [ -z "$CHANGES" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MESSAGE="📦 Auto commit on branch '$BRANCH':\n"

          while IFS= read -r line; do
            [ -z "$line" ] && continue

            staged="${line:0:1}"
            unstaged="${line:1:1}"
            code="$staged"

            if [ "$code" = " " ]; then
              code="$unstaged"
            fi

            path="${line:3}"
            path="${path# }"

            case "$code" in
              M)
                MESSAGE+="- Modified: $path\n"
                ;;
              A|\?)
                MESSAGE+="- Created: $path\n"
                ;;
              D)
                MESSAGE+="- Deleted: $path\n"
                ;;
              R)
                from="${path%% -> *}"
                to="${path##* -> }"
                MESSAGE+="- Renamed: $from -> $to\n"
                ;;
              *)
                MESSAGE+="- $code: $path\n"
                ;;
            esac
          done <<< "$CHANGES"

          echo -e "$MESSAGE" > commit_message.txt
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit changes if any
        if: steps.prepare_commit_message.outputs.has_changes == 'true'
        run: |
          git add --all
          git commit -F commit_message.txt

      - name: Setup GitLab SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_company
          chmod 600 ~/.ssh/id_ed25519_company

          ssh-keyscan -p "$GITLAB_PORT" "$GITLAB_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Push to GitLab via SSH
        run: |
          set -euo pipefail

          REMOTE_URL="ssh://git@${GITLAB_HOST}:${GITLAB_PORT}/${GITLAB_REPO_PATH}"

          git remote add gitlab "$REMOTE_URL" 2>/dev/null || \
            git remote set-url gitlab "$REMOTE_URL"

          GIT_SSH_COMMAND="ssh \
            -i ~/.ssh/id_ed25519_company \
            -o IdentitiesOnly=yes" \
            git push gitlab HEAD:${GITLAB_TARGET_BRANCH} --force
