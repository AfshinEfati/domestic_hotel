name: Mirror afshin branch to GitLab (HTTPS with password)

on:
  push:
    branches:
      - afshin

permissions:
  contents: read

jobs:
  push-to-gitlab:
    runs-on: ubuntu-latest
    env:
      GITLAB_HTTP_REPO: http://185.8.173.250/root/domestic_hotel_gds.git
      GITLAB_TARGET_BRANCH: afshin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

      - name: Create commit message with changes
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          MESSAGE="📦 Auto commit on branch '$BRANCH':\n"
          CHANGES=$(git status --short)

          while read -r line; do
              status=$(echo "$line" | awk '{print $1}')
              file=$(echo "$line" | awk '{print $2}')
              MESSAGE+="- $status $file\n"
          done <<< "$CHANGES"

          echo -e "$MESSAGE" > commit_message.txt

      - name: Commit changes if any
        run: |
          git add .
          if [ -s commit_message.txt ]; then
            git commit -F commit_message.txt || echo "No changes to commit"
          fi

      - name: Configure credentials securely and push to GitLab
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
          GITLAB_HTTP_REPO: ${{ env.GITLAB_HTTP_REPO }}
          GITLAB_TARGET_BRANCH: ${{ env.GITLAB_TARGET_BRANCH }}
        run: |
          # create ~/.git-credentials with the HTTP credentials (GitHub masks secrets in logs)
          mkdir -p ~/.git
          # write credentials in the store used by git credential.helper
          printf "https://%s:%s@%s\n" "$GITLAB_USERNAME" "$GITLAB_PASSWORD" "$(echo "$GITLAB_HTTP_REPO" | sed -e 's#^https\?://##' -e 's#^http\?://##')" > ~/.git-credentials
          git config --global credential.helper store
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"

          # add remote and push
          # use URL without credentials (credential.helper will supply them)
          git remote add gitlab "${GITLAB_HTTP_REPO}" || git remote set-url gitlab "${GITLAB_HTTP_REPO}"
          git push --set-upstream gitlab HEAD:${GITLAB_TARGET_BRANCH} --force

      - name: Cleanup credential file
        if: always()
        run: |
          # remove stored credentials to be safe (runner is ephemeral but still cleanup)
          git config --global --unset credential.helper || true
          rm -f ~/.git-credentials || true
